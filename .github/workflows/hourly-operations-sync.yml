# Hourly Metabase → Supabase orders sync + materialized view refresh.
#
# ── Required GitHub secrets (Settings → Secrets and variables → Actions) ─────
#   NEXT_PUBLIC_SUPABASE_URL      — Full URL with https:// e.g. https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY     — Service role key (not anon key)
#
# ── Optional secrets ─────────────────────────────────────────────────────────
#   METABASE_ORDERS_API_URL       — Override Metabase orders JSON feed.
#                                   IMPORTANT: Do not create this secret with an
#                                   empty value — delete it entirely to use the
#                                   built-in default Metabase URL.
#   DATABASE_URL                  — Supabase Postgres URI (Session pooler). Faster sync.
#                                   Strongly recommended — MV refresh needs direct Postgres
#                                   to avoid Supabase REST statement timeout (~8s).
#   VERCEL_PRODUCTION_URL         — e.g. https://360-portal-beige.vercel.app
#   CRON_SECRET                   — Same value as Vercel CRON_SECRET
#
# Schedule: every hour at :00 UTC.

name: Hourly Operations Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "ops_sync_jobs UUID — set when triggered from the portal Sync Data button"
        required: false
        type: string

concurrency:
  group: hourly-operations-sync
  cancel-in-progress: false

jobs:
  sync-orders-and-refresh:
    name: Sync orders & refresh materialized views
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show commit
        run: git rev-parse --short HEAD && git log -1 --oneline

      - name: Validate required secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::error::Missing GitHub secret NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          fi
          case "${NEXT_PUBLIC_SUPABASE_URL}" in
            http://*|https://*) ;;
            *)
              echo "::error::NEXT_PUBLIC_SUPABASE_URL must include https:// (e.g. https://xxxx.supabase.co)"
              exit 1
              ;;
          esac
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Missing GitHub secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
          echo "Required secrets are set."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-sync.txt

      - name: Install sync dependencies
        run: pip install -r scripts/requirements-sync.txt

      - name: Sync Metabase orders to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          METABASE_ORDERS_API_URL: ${{ secrets.METABASE_ORDERS_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Empty GitHub secrets still inject "" — unset or use built-in default Metabase feed
          DEFAULT_METABASE="https://zambeel.metabaseapp.com/public/question/96450ced-a27c-47c9-b9cd-58fe804a7889.json"
          if [ -z "${METABASE_ORDERS_API_URL:-}" ]; then
            unset METABASE_ORDERS_API_URL || true
            export METABASE_ORDERS_API_URL="${DEFAULT_METABASE}"
          fi
          unset METABASE_OPERATIONS_ORDERS_URL || true
          if [ -z "${DATABASE_URL:-}" ]; then
            unset DATABASE_URL || true
          fi
          echo "Metabase URL: ${METABASE_ORDERS_API_URL}"
          JOB_ID="${{ inputs.job_id }}"
          JOB_ARGS=""
          if [ -n "${JOB_ID}" ]; then
            echo "Portal job id: ${JOB_ID}"
            JOB_ARGS="--job-id ${JOB_ID}"
          fi
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "Using Postgres upsert (DATABASE_URL set)"
            python scripts/sync_orders.py --batch-size 10000 --workers 4 ${JOB_ARGS}
          else
            echo "Using REST upsert (no DATABASE_URL)"
            python scripts/sync_orders.py --rest --batch-size 1000 --workers 2 ${JOB_ARGS}
          fi

      - name: Invalidate portal operations cache (optional)
        continue-on-error: true
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Skipping cache revalidation — set VERCEL_PRODUCTION_URL and CRON_SECRET to enable"
            exit 0
          fi
          BASE="${VERCEL_URL%/}"
          echo "Calling ${BASE}/api/operations/revalidate"
          curl -sf -X POST \
            "${BASE}/api/operations/revalidate" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 60
          echo "Operations cache invalidated."

      - name: Full operations sync via Vercel cron (optional)
        continue-on-error: true
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Skipping Vercel cron — set VERCEL_PRODUCTION_URL and CRON_SECRET to enable"
            exit 0
          fi
          BASE="${VERCEL_URL%/}"
          echo "Calling ${BASE}/api/cron/operations-sync"
          curl -sf -X GET \
            "${BASE}/api/cron/operations-sync" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 1800
          echo "Full operations sync completed."
